services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-local-only
      POSTGRES_DB: arc
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - arc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arc -d arc']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  arc-postgres:
